project_id = "onnbmmdbrsgytfozfozn"

# record-engagement is a public analytics sink hit via navigator.sendBeacon,
# which cannot attach the anon apikey header, so JWT verification must be off.
[functions.record-engagement]
verify_jwt = false

# vehicle-lookup is authenticated via a shared secret header (x-lookup-secret)
# so sister apps (AutoFilm) can query without minting a Supabase JWT.
[functions.vehicle-lookup]
verify_jwt = false

# autofilm-feed is the sister-app inventory feed, authenticated by the same
# shared secret header vehicle-lookup uses (x-lookup-secret, or x-autofilm-key).
# AutoFilm sends no Authorization header and mints no Supabase JWT, so leaving
# this to the platform default would 401 every call at the gateway before the
# function's own auth ever ran — and the failure would look like a broken feed
# rather than a config gap.
[functions.autofilm-feed]
verify_jwt = false

# public-document-asset mints a short-lived signed URL for one asset of one
# currently PUBLISHED vehicle document. Shoppers on /v/:slug are anonymous,
# so JWT verification is off; the function guards itself (slug is the only
# caller-supplied key, and the RPC returns nothing for drafts, pending or
# superseded versions).
[functions.public-document-asset]
verify_jwt = false

# oem-brochure and oem-owners-manual reach a metered search provider and write
# to a GLOBAL link cache, so an anonymous caller would be spending our money.
# JWT verification stays ON — pinned here rather than left to the default so a
# later edit has to argue with this comment first. The ingest-time call is not
# an exception to it: intake-autoprovision invokes these with the project's
# service-role bearer, which the gateway accepts and isServiceOrCron matches,
# exactly as every other artifact call in that pipeline already does.
[functions.oem-brochure]
verify_jwt = true

[functions.oem-owners-manual]
verify_jwt = true

# packet-backfill buys OEM window stickers and Firecrawl searches on every call
# it makes. It is service-role/cron only and gates itself with isServiceOrCron,
# but the platform default is stated explicitly here so that the entry has to be
# edited — not merely added — before this one can ever be made public.
[functions.packet-backfill]
verify_jwt = true

# oem-document-store is the only place manufacturer document bytes are fetched.
# It claims the right to host first (which records the decision) and refuses
# before touching the network when the dealer is not franchised for the brand.
# Service role only; there is no user-facing path to storing a byte.
[functions.oem-document-store]
verify_jwt = true

# market-valuation-write is the sole writer of market valuation decisions and
# the only function that can spend MarketCheck money. Gateway JWT verification
# is OFF because trusted service callers present a Supabase secret in the
# `apikey` header, and the platform gate rejects an apikey-only request before
# the function can ever see it — which is precisely what happened: an
# apikey-only dry run returned 401 with no function log, because the handler
# never ran.
#
# This does NOT make the function public. Every POST is authenticated inside
# the handler by `authenticateCaller`, which:
#   • matches the canonical legacy service-role credential in constant time
#     against the runtime's own SUPABASE_SERVICE_ROLE_KEY (no claim is read,
#     so a forged role=service_role payload buys nothing);
#   • verifies modern sb_secret_* keys through @supabase/server's secret mode;
#   • verifies signed user JWTs against the project JWKS, then applies tenant
#     membership / platform-admin authorization.
#
# Authentication completes BEFORE the budget reservation, before any provider
# fetch, and before any valuation, comparable, audit or compatibility write.
# An unauthenticated caller reaches none of them. See
# src/lib/market/... guards and supabase/functions/_shared/functionAuth.ts.
[functions.market-valuation-write]
verify_jwt = false
